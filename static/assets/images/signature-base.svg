<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Diagram showing the three elements of the signature base: Signature-Input, Content-Digest and Signature">
  <defs>
    <style>
      .box { fill: #f4f6fb; stroke: #4a5bd4; stroke-width: 2; rx: 8; }
      .accent { fill: #eef1fc; stroke: #4a5bd4; stroke-width: 2; }
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #1f2a5a; }
      .label { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #1f2a5a; }
      .sub { font: 13px 'Segoe UI', Arial, sans-serif; fill: #4a4a5a; }
      .arrow { stroke: #4a5bd4; stroke-width: 2; fill: none; marker-end: url(#ah); }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a5bd4"/>
    </marker>
  </defs>

  <text x="30" y="34" class="title">Elements of the signature base</text>

  <!-- Signature-Input -->
  <rect x="30" y="60" width="220" height="90" rx="8" class="box"/>
  <text x="45" y="90" class="label">Signature-Input</text>
  <text x="45" y="114" class="sub">Describes how the</text>
  <text x="45" y="132" class="sub">signature base is formed.</text>

  <!-- Content-Digest -->
  <rect x="30" y="170" width="220" height="90" rx="8" class="box"/>
  <text x="45" y="200" class="label">Content-Digest</text>
  <text x="45" y="224" class="sub">Hash of the body.</text>
  <text x="45" y="242" class="sub">Included when a body is present.</text>

  <!-- Signature base -->
  <rect x="320" y="115" width="180" height="90" rx="8" class="accent"/>
  <text x="335" y="150" class="label">Signature base</text>
  <text x="335" y="174" class="sub">The data to be signed,</text>
  <text x="335" y="192" class="sub">built from the components.</text>

  <!-- Signature -->
  <rect x="560" y="115" width="180" height="90" rx="8" class="box"/>
  <text x="575" y="150" class="label">Signature</text>
  <text x="575" y="174" class="sub">Signature base signed</text>
  <text x="575" y="192" class="sub">with your private key.</text>

  <!-- Arrows -->
  <path class="arrow" d="M250,105 L318,150"/>
  <path class="arrow" d="M250,215 L318,170"/>
  <path class="arrow" d="M500,160 L558,160"/>
</svg>
